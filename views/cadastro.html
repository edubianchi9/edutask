<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduTask | Criar conta</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <h1>EduTask</h1>

            <p class="subtitle">
                Crie sua conta
            </p>

            <form
                action="/usuarios/cadastro"
                method="POST"
            >

                <div class="input-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        maxlength="100"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        maxlength="150"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        minlength="6"
                        required
                    >

                </div>

                <button type="submit">
                    Criar conta
                </button>

            </form>

            <p class="register-text">

                Já possui uma conta?

                <a href="/">
                    Entrar
                </a>

            </p>

        </section>

    </main>

</body>

</html>
