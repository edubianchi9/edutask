<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTask | Disciplinas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">EduTask</div>
            <nav class="sidebar-menu" aria-label="Menu principal">
                <a href="/dashboard" class="menu-item">Dashboard</a>
                <a href="/disciplinas" class="menu-item active" aria-current="page">Disciplinas</a>
            </nav>
            <form action="/usuarios/logout" method="POST" class="logout-form">
                <button type="submit" class="logout-button">Sair</button>
            </form>
        </aside>
        <main class="dashboard-content">
            <header class="dashboard-header">
                <div>
                    <p class="welcome-small">Organize seu semestre</p>
                    <h1>Disciplinas</h1>
                </div>
            </header>
            <section class="dashboard-section" aria-labelledby="titulo-formulario">
                <div class="section-header"><h2 id="titulo-formulario">Nova disciplina</h2></div>
                <form id="disciplina-form" class="disciplina-form">
                    <div class="form-field">
                        <label for="nome">Nome da disciplina</label>
                        <input id="nome" name="nome" type="text" maxlength="100" required placeholder="Ex.: Engenharia de Software">
                    </div>
                    <div class="form-field">
                        <label for="periodo">Período (opcional)</label>
                        <input id="periodo" name="periodo" type="text" maxlength="30" placeholder="Ex.: 2026/2">
                    </div>
                    <button class="primary-button" type="submit">Adicionar disciplina</button>
                </form>
                <p id="mensagem" class="feedback" role="status" aria-live="polite"></p>
            </section>
            <section class="dashboard-section" aria-labelledby="titulo-lista">
                <div class="section-header"><h2 id="titulo-lista">Minhas disciplinas</h2></div>
                <p id="estado-vazio" class="empty-state">Carregando disciplinas...</p>
                <ul id="lista-disciplinas" class="disciplina-lista"></ul>
            </section>
        </main>
    </div>
    <script src="/js/disciplinas.js"></script>
</body>
</html>
