<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduTask | Login</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <h1>EduTask</h1>

            <p class="subtitle">
                Organize. Planeje. Conclua.
            </p>

            <form action="/usuarios/login" method="POST">

    <div class="input-group">

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
        >

    </div>

    <div class="input-group">

        <label for="senha">
            Senha
        </label>

        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            required
        >

    </div>

    <button type="submit">
        Entrar
    </button>

</form>

            <p class="register-text">
                Ainda não possui uma conta?

                <a href="/views/cadastro.html">
                    Criar conta
                </a>
            </p>

        </section>

    </main>

</body>

</html>
